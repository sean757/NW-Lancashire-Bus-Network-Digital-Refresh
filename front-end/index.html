<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancashire Journey Planner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="ClientPack/source/style/styles.css">

</head>

<body>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button class="close-btn" id="closeSidebar" aria-label="Close navigation menu">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#" id="languageLink">Languages</a></li>
            <li><a href="#" id="settingsLink">Settings</a></li>
            <li><a href="#" id="reportBugLink">Report Bug</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <button class="menu-btn" id="menuBtn" aria-label="Open navigation menu">&#9776;</button>
            <h1>Lancashire Journey Planner</h1>
            <img src="ClientPack/source/img/world.png" class="logo" alt="logo">
        </header>

        <!-- Route Planning Section -->
        <section class="route-planner">
            <button class="planner-toggle" id="plannerToggle" aria-label="Toggle route planner" aria-expanded="true">
                <span class="toggle-text">Route Planner</span>
                <span class="toggle-icon">▼</span>
            </button>

            <div class="planner-content" id="plannerContent">
                <div class="planner-row">
                    <div class="input-group">
                        <label for="startPoint">Start Point:</label>
                        <input type="text" id="startPoint" placeholder="Enter starting location">
                    </div>
                    <div class="input-group">
                        <label for="endPoint">End Point:</label>
                        <input type="text" id="endPoint" placeholder="Enter destination">
                    </div>
                </div>

                <div class="planner-row">

                    <div class="input-group">
                        <label for="timeType">Time Type:</label>
                        <select id="timeType">
                            <option value="depart-after">Depart After</option>
                            <option value="arrive-before">Arrive Before</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="departureTime">Date &amp; Time:</label>
                        <input type="datetime-local" id="departureTime">
                    </div>

                    <div class="input-group">
                        <label for="pathfinding">Pathfinding Preference:</label>
                        <select id="pathfinding">
                            <option value="fastest">Fastest Time</option>
                            <option value="least-changes">Least Number of Changes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="walkingSpeed">Walking Speed:</label>
                        <select id="walkingSpeed">
                            <option value="slow">Slow</option>
                            <option value="medium" selected>Medium</option>
                            <option value="fast">Fast</option>
                        </select>
                    </div>

                    <button class="plan-route-btn" id="planRouteBtn">Plan Route</button>
                </div>
            </div>
        </section>

        <!-- Map and Route Display -->
        <div class="map-container">
            <!-- Route Display Panel -->
            <div class="route-display" id="routeDisplay">
                <h3>Route Information</h3>
                <div class="route-content" id="routeContent">
                    <p>Enter your start and end points to plan your journey.</p>
                </div>
            </div>

            <div id="map"></div>
        </div>
    </div>

    <!-- Bug Report Modal -->
    <div class="modal" id="bugReportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Report a Bug</h2>
                <button class="close-btn" id="closeBugModal" aria-label="Close bug report">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="bugType">Bug Type:</label>
                    <select id="bugType">
                        <option value="ui">UI Bug</option>
                        <option value="functional">Functional Bug</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="bugDescription">Bug Description:</label>
                    <textarea id="bugDescription" placeholder="Please describe the bug you encountered..."
                        rows="6"></textarea>
                </div>

                <button class="save-settings-btn" id="reportBugBtn">Report</button>
            </div>
        </div>
    </div>

    <!-- Language Selection Modal -->
    <div class="modal" id="languageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Language / 语言</h2>
                <button class="close-btn" id="closeLanguageModal" aria-label="Close language settings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="languageSelect">Select Language / 选择语言:</label>
                    <select id="languageSelect">
                        <option value="en" selected>English</option>
                        <option value="zh">中文 (Chinese)</option>
                    </select>
                </div>
                <button class="save-settings-btn" id="saveLanguage">Apply / 应用</button>
            </div>
        </div>
    </div>

    <!-- App Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeSettingsModal" aria-label="Close settings">&times;</button>
            </div>
            <div class="modal-body">
                <details class="settings-section" open>
                    <summary id="settingsSectionMap">Map Settings</summary>

                    <div class="setting-group settings-checkbox-row">
                        <label for="settingsShowWeather">Show weather icon</label>
                        <input type="checkbox" id="settingsShowWeather" checked>
                    </div>

                    <div class="setting-group settings-checkbox-row">
                        <label for="settingsShowMapHints">Show map helper pop-ups</label>
                        <input type="checkbox" id="settingsShowMapHints" checked>
                    </div>

                    <div class="setting-group settings-checkbox-row">
                        <label for="settingsDarkMap">Dark mode map tint</label>
                        <input type="checkbox" id="settingsDarkMap">
                    </div>

                    <div class="setting-group settings-checkbox-row">
                        <label for="settingsShowLiveBuses">Show live bus locations</label>
                        <input type="checkbox" id="settingsShowLiveBuses" checked>
                    </div>

                    <div class="setting-group settings-checkbox-row">
                        <label for="settingsShowBusStops">Show bus stops</label>
                        <input type="checkbox" id="settingsShowBusStops" checked>
                    </div>
                </details>

                <details class="settings-section" open>
                    <summary id="settingsSectionNotifications">Notification Settings</summary>

                    <div class="setting-group settings-checkbox-row">
                        <label for="settingsDisableNotifications">Disable notification messages</label>
                        <input type="checkbox" id="settingsDisableNotifications">
                    </div>
                </details>

                <details class="settings-section" open>
                    <summary id="settingsSectionAccessibility">Accessibility Settings</summary>

                    <div class="setting-group">
                        <label for="fontSize">Font Size:</label>
                        <select id="fontSize">
                            <option value="small">Small</option>
                            <option value="medium" selected>Medium</option>
                            <option value="large">Large</option>
                            <option value="extra-large">Extra Large</option>
                        </select>
                    </div>

                    <div class="setting-group settings-checkbox-row">
                        <label for="highContrast">High Contrast Mode:</label>
                        <input type="checkbox" id="highContrast">
                    </div>
                </details>

                <button class="save-settings-btn" id="saveUiSettings">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Weather Widget -->
    <div class="weather-widget" id="weatherWidget">
        <div class="weather-loading">Loading weather...</div>
    </div>



    <!-- Notification Toast -->
    <div class="notification-toast" id="notificationToast" role="status" aria-live="polite"></div>

    <!-- Leaflet JS -->
    <script src="lib/leaflet/leaflet.js"></script>

    <!-- Weather API -->
    <script src="ClientPack/source/script/weather.js"></script>

    <!-- Custom JS -->
    <script src="ClientPack/source/script/app.js"></script>

</body>

</html>
